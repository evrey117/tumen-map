name: Audit housing storage in isolated sandbox
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run build
      - run: node scripts/audit-storage-sandbox.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-storage-audit
          path: test-results/storage-sandbox.json
